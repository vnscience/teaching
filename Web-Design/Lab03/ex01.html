<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 03 - Profile Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="w-80 bg-white rounded-2xl shadow-lg p-6 text-center">
        <img class="size-24 rounded-full mx-auto border-4 border-sky-500" src="./images/avatar.png" alt="Avatar">
        <h1 class="mt-4 text-xl font-bold text-slate-800">Alex Nguyen</h1>
        <p class="text-sm text-sky-600 font-medium">Front-end Developer</p>
        <p class="mt-3 text-sm text-slate-600 leading-relaxed">I build fast, responsive websites with HTML, CSS, and Tailwind CSS</p>
        <div class="mt-4 flex justify-center gap-2">
            <a class="bg-blue-600 text-white text-sm px-4 py-2 rounded-2xl hover:bg-blue-800 transition-colors duration-300" href="#">Facebook</a>
            <a class="bg-slate-600 text-white text-sm px-4 py-2 rounded-2xl hover:bg-blue-800 transition-colors duration-300" href="#">Github</a>
            <a class="bg-sky-600 text-white text-sm px-4 py-2 rounded-2xl hover:bg-blue-800 transition-colors duration-300" href="#">LinkedIn</a>
        </div>
    </div>
</body>
</html>
